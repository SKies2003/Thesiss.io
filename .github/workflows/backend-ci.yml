# Name of the CI workflow
name: Backend CI

# This workflow runs on any push or pull request to the 'main' branch, but only if changes were made inside the 'backend/' directory.
on:
  push:
    branches: [ "main" ]
    paths:
      - 'backend/**'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'backend/**'

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  lint:
    # The type of runner that the job will run on (e.g., a fresh virtual machine)
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Step 1: Checks-out your repository under the runner, so your job can access your code
      - name: Checkout code
        uses: actions/checkout@v3

      # Step 2: Set up the Python version we want to use
      - name: Set up Python 3.10
        uses: actions/setup-python@v3
        with:
          python-version: '3.10'

      # Step 3: Install project dependencies, including our linter (flake8)
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
      
      # Step 4: Lint the code with flake8 to check for style errors and potential bugs
      - name: Lint with flake8
        run: |
          # stop the build if there are Python syntax errors or undefined names
          flake8 backend --count --select=E9,F63,F7,F82 --show-source --statistics
          # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
          flake8 backend --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics